# Build a sideloadable Android debug APK (Expo prebuild + Gradle).
#
# After this file is on your default branch:
#   GitHub → Actions → "Android APK (debug)" → Run workflow
#
# Artifacts: gigbox-debug-<sha> contains app-debug.apk
name: Android APK (debug)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Prebuild and assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 14.x
          cache: yarn
          cache-dependency-path: app/yarn.lock

      # sdkmanager from setup-android@v3 requires JDK 17+.
      - name: Setup Java 17 (Android SDK tools)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Gradle 6.8 + RN 0.63 Groovy scripts are not reliable on JDK 17 (script compilation failures).
      - name: Setup Java 11 (Gradle / Expo)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Install JS dependencies
        run: yarn install --ignore-engines

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      # expo-cli rewrites package.json (e.g. downgrades react-native-unimodules). Restore the committed manifests.
      - name: Restore package manifests after prebuild
        working-directory: ${{ github.workspace }}
        run: git checkout HEAD -- app/package.json app/index.js

      # Old templates may still list MaxPermSize; harmless to strip for any JDK.
      - name: Sanitize Gradle JVM args in generated project
        run: |
          find android -name gradle.properties -type f 2>/dev/null | while read -r f; do
            sed -i 's/-XX:MaxPermSize=[^ ]*//g' "$f"
          done

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gigbox-debug-${{ github.sha }}
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
