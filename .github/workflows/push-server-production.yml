name: Build and push production server

# Controls when the action will run.
on:
  push:
    branches: [master]
    paths:
      - server/**
  workflow_dispatch:

jobs:
  build-and-push-docker-hub:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set; skipping Docker image push."
          fi
      - name: Set up QEMU
        if: steps.dockerhub.outputs.ready == 'true'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: steps.dockerhub.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        if: steps.dockerhub.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        id: docker_build
        if: steps.dockerhub.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ./server
          file: ./server/Dockerfile.prod
          tags: gigbox/gigbox-server:latest
      - name: Image digest
        if: steps.dockerhub.outputs.ready == 'true'
        run: echo ${{ steps.docker_build.outputs.digest }}
